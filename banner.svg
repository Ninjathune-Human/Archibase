<svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="#0A0A0A"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.05"/>

  <!-- corner drafting ticks -->
  <g stroke="#525252" stroke-width="1.5">
    <path d="M20 20H60M20 20V60" fill="none"/>
    <path d="M1260 20H1220M1260 20V60" fill="none"/>
    <path d="M20 300H60M20 300V260" fill="none"/>
    <path d="M1260 300H1220M1260 300V260" fill="none"/>
  </g>

  <!-- brand mark: plan fragment, matching the app -->
  <g transform="translate(96,96)">
    <g stroke="#FAFAF8" stroke-width="2" opacity="0.28">
      <line x1="45" y1="0" x2="45" y2="128"/>
      <line x1="85" y1="0" x2="85" y2="128"/>
      <line x1="0" y1="45" x2="128" y2="45"/>
      <line x1="0" y1="85" x2="128" y2="85"/>
    </g>
    <path d="M12 116 V12 H116" fill="none" stroke="#FAFAF8" stroke-width="11"/>
    <path d="M45 85 H85 V45" fill="none" stroke="#FAFAF8" stroke-width="7"/>
    <rect x="74" y="74" width="21" height="21" fill="#E1332B"/>
  </g>

  <!-- text block -->
  <text x="270" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#FAFAF8" font-weight="700" letter-spacing="2">ATLAS</text>
  <text x="272" y="190" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#9A9A9A" letter-spacing="3">RELEVÉ DE PROJETS D'ARCHITECTURE</text>
  <line x1="272" y1="208" x2="720" y2="208" stroke="#E1332B" stroke-width="2"/>
  <text x="272" y="238" font-family="Georgia, serif" font-size="16" fill="#C8C8C4">Carte interactive, collections, filtres, complétion</text>
  <text x="272" y="261" font-family="Georgia, serif" font-size="16" fill="#C8C8C4">Wikidata / Wikipédia — mono-fichier HTML/JS</text>

  <!-- stylized elevation, right side -->
  <g stroke="#EDEDEA" stroke-width="2" fill="none">
    <path d="M880 256 V180 H920 V150 H950 V120 H982 V256 Z"/>
    <path d="M1010 256 L1056 150 L1102 256 Z"/>
    <rect x="1130" y="110" width="80" height="146"/>
    <g stroke="#525252" stroke-width="1">
      <line x1="1130" y1="146" x2="1210" y2="146"/>
      <line x1="1130" y1="182" x2="1210" y2="182"/>
      <line x1="1130" y1="218" x2="1210" y2="218"/>
      <line x1="1170" y1="110" x2="1170" y2="256"/>
    </g>
  </g>
  <line x1="860" y1="256" x2="1240" y2="256" stroke="#282828" stroke-width="2"/>
</svg>
