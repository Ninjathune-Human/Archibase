<svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="1280" height="320" fill="#0A0A0A"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.05"/>

  <!-- corner drafting ticks -->
  <g stroke="#525252" stroke-width="1.5">
    <path d="M20 20H60M20 20V60" fill="none"/>
    <path d="M1260 20H1220M1260 20V60" fill="none"/>
    <path d="M20 300H60M20 300V260" fill="none"/>
    <path d="M1260 300H1220M1260 300V260" fill="none"/>
  </g>

  <!-- baseline -->
  <line x1="620" y1="256" x2="1250" y2="256" stroke="#282828" stroke-width="1.5"/>

  <!-- skyline: stylized elevation of building archetypes, line only -->
  <g stroke="#EDEDEA" stroke-width="2" fill="none" stroke-linejoin="round">
    <!-- stepped / setback tower -->
    <path d="M650 256 V180 H690 V150 H720 V120 H752 V256 Z"/>
    <!-- pyramid form -->
    <path d="M780 256 L826 150 L872 256 Z"/>
    <!-- grid curtain-wall tower with mullions -->
    <rect x="905" y="90" width="90" height="166"/>
    <g stroke="#525252" stroke-width="1">
      <line x1="905" y1="118" x2="995" y2="118"/>
      <line x1="905" y1="146" x2="995" y2="146"/>
      <line x1="905" y1="174" x2="995" y2="174"/>
      <line x1="905" y1="202" x2="995" y2="202"/>
      <line x1="905" y1="230" x2="995" y2="230"/>
      <line x1="932" y1="90" x2="932" y2="256"/>
      <line x1="959" y1="90" x2="959" y2="256"/>
    </g>
    <!-- arch form -->
    <path d="M1030 256 V180 A45 45 0 0 1 1120 180 V256"/>
    <!-- slender spire -->
    <path d="M1150 256 V130 L1168 96 L1186 130 V256"/>
  </g>

  <!-- visited-style pin marking the curtain-wall tower -->
  <g filter="url(#shadow)" transform="translate(936,44)">
    <path d="M14 0C6.3 0 0 6.3 0 14c0 9.7 14 22.6 14 22.6s14-12.9 14-22.6C28 6.3 21.7 0 14 0z" fill="#E1332B" stroke="#0A0A0A" stroke-width="1.5"/>
    <path d="M8 14.3l3.4 3.4L20 9" fill="none" stroke="#FAFAF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- dimension line, architectural drawing reference -->
  <g stroke="#525252" stroke-width="1">
    <line x1="1210" y1="90" x2="1210" y2="256"/>
    <line x1="1202" y1="90" x2="1218" y2="90"/>
    <line x1="1202" y1="256" x2="1218" y2="256"/>
  </g>
  <text x="1220" y="176" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#9A9A9A" letter-spacing="1" transform="rotate(90 1220 176)">H VAR.</text>

  <!-- coordinate ring, echoes the app's map pins -->
  <circle cx="950" cy="58" r="46" fill="none" stroke="#E1332B" stroke-width="1" opacity="0.35" stroke-dasharray="3 5"/>

  <!-- text block -->
  <text x="120" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#FAFAF8" font-weight="700" letter-spacing="2">ATLAS</text>
  <text x="122" y="188" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#9A9A9A" letter-spacing="3">RELEVÉ DE PROJETS D'ARCHITECTURE</text>

  <line x1="122" y1="205" x2="560" y2="205" stroke="#E1332B" stroke-width="2"/>

  <text x="122" y="235" font-family="Georgia, serif" font-size="16" fill="#C8C8C4">Carte interactive, recherche, épingles manuelles</text>
  <text x="122" y="258" font-family="Georgia, serif" font-size="16" fill="#C8C8C4">et import Wikidata / RCE — mono-fichier HTML/JS</text>
</svg>
